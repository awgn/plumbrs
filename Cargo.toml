[package]
name = "plumbrs"
version = "0.27.0"
edition = "2024"
authors = ["Nicola Bonelli <nicola@larthia.com>"]
description = "A high-performance HTTP/1.1 and HTTP/2 benchmarking tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/awgn/plumbrs"
readme = "README.md"
keywords = ["cli", "utility", "benchmark", "http", "http2"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
h2 = "0.4.18"
http = "1.5.0"
httparse = "1.10.1"
hyper = { version = "1.11.0", features = ["full"] }
pretty_env_logger = "0.5.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "service", "tokio"] }
http-body-util = "0.1.5"
anyhow = "1.0.104"
reqwest = { version = "0.13", features = ["stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rmcp = { version = "1.8", optional = true }
rand = "0.8"
atomic-time = "0.1.5"
scopeguard = "1.2.0"
crossterm = "0.29"
hdrhistogram = "7.6.0"
futures-util = "0.3.34"
tabled = "0.20"
http_wire = "0.7.1"
ctor = "0.6.3"
const_format = "0.2.36"
quanta = "0.12.6"
webpki-roots = "1"
compio = { version = "0.18.0", optional = true, features = ["io", "net", "macros", "runtime"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5.0", optional = true }
monoio = { version = "0.2.4", optional = true, features = ["sync"] }

io-uring = { version = "0.6.4", optional = true }

[dependencies.mimalloc]
version = "0.1"
optional = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[features]
default = ["mimalloc"]
tokio_uring = ["dep:tokio-uring"]
monoio = ["dep:monoio", "dep:io-uring"]
compio = ["dep:compio"]
mcp = ["dep:rmcp"]

[profile.release]
debug = false
opt-level = 3
strip = true
codegen-units = 1
lto = true
